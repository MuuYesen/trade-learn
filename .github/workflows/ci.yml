name: CI

on:
  pull_request:
  push:
    branches: ["master", "dev", "publish/**", "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: unified dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv lock --check

  bootstrap:
    name: oracle and selected-profile bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/prepare-oracle
      - name: Diagnose default environment and create explicit selected interpreter
        run: python .github/actions/prepare-ci-environment.py --python 3.12 --probe-default
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync python scripts/check_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-diagnostic
          path: ${{ runner.temp }}/ci-environment-diagnostic.json

  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    needs: bootstrap
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/prepare-oracle
      # Qualify the actual selected metadata while the separately mandatory
      # universal lock check exposes unpublished optional distributions.
      - run: python .github/actions/prepare-ci-environment.py --python "${{ matrix.python-version }}"
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync ruff check tradelearn/core tradelearn/data tradelearn/factor tradelearn/indicators tradelearn/metrics tradelearn/report tradelearn/integrations tests/unit/core tests/unit/data tests/unit/factor tests/unit/indicators tests/unit/metrics tests/unit/report tests/unit/integrations tests/golden tests/consistency scripts
      - run: uv run --no-sync pytest --junitxml=pytest-results.xml
      - name: Expose test failures in public annotations
        if: failure()
        run: python scripts/report_test_failures.py pytest-results.xml
      - run: uv run --no-sync pytest tests/unit/metrics tests/consistency/test_metrics.py --cov=tradelearn.metrics --cov-report=term-missing --cov-fail-under=100
      - run: uv run --no-sync pytest tests/unit/core --doctest-modules tradelearn/core
      - run: uv run --no-sync pytest --doctest-modules tradelearn/data
      - run: uv run --no-sync pytest --doctest-modules tradelearn/metrics
      - run: uv run --no-sync interrogate tradelearn/core tradelearn/data tradelearn/factor tradelearn/indicators tradelearn/metrics tradelearn/report --fail-under 90

  consistency:
    name: consistency
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/prepare-oracle
      - run: python .github/actions/prepare-ci-environment.py --python 3.12
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync pytest tests/consistency/ -v --tb=short --junitxml=consistency-results.xml
      - name: Expose consistency failures
        if: failure()
        run: python scripts/report_test_failures.py consistency-results.xml
      - run: uv run --no-sync pytest tests/golden/ -v

  oracle:
    name: oracle-readiness
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/prepare-oracle
      - run: python .github/actions/prepare-ci-environment.py --python 3.12
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync python scripts/check_oracle.py

  official-na-boundary:
    name: official NA CP313 boundary
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: python .github/actions/prepare-ci-environment.py --python 3.13
      - run: uv pip install -e '.[nautilus,tl-store]' --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync pytest tests/test_observation_clock_domain.py tests/test_sdk_tl_version_boundary.py tests/test_live*.py tests/test_native_fill_void_projection.py tests/test_native_cash_subset.py tests/unit/engine --junitxml=na-results.xml
      - name: Expose official NA boundary failures
        if: failure()
        run: python scripts/report_test_failures.py na-results.xml
