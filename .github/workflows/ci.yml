name: CI

on:
  pull_request:
  push:
    branches: ["master", "dev", "publish/**", "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-lock:
    name: unified dependency lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv lock --check

  bootstrap:
    name: oracle and selected-profile bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/prepare-oracle
      - name: Diagnose default environment and create explicit selected interpreter
        run: python .github/actions/prepare-ci-environment.py --python 3.12 --probe-default
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync python scripts/check_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bootstrap-diagnostic
          path: ${{ runner.temp }}/ci-environment-diagnostic.json

  test:
    name: ${{ matrix.os }} py${{ matrix.python-version }}
    needs: bootstrap
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/prepare-oracle
      # Qualify the actual selected metadata while the separately mandatory
      # universal lock check exposes unpublished optional distributions.
      - run: python .github/actions/prepare-ci-environment.py --python "${{ matrix.python-version }}"
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync ruff check tradelearn/core tradelearn/data tradelearn/factor tradelearn/indicators tradelearn/metrics tradelearn/report tradelearn/integrations tests/unit/core tests/unit/data tests/unit/factor tests/unit/indicators tests/unit/metrics tests/unit/report tests/unit/integrations tests/golden tests/consistency scripts
      - run: uv run --no-sync pytest --junitxml=pytest-results.xml
      - name: Expose test failures in public annotations
        if: failure()
        run: python scripts/report_test_failures.py pytest-results.xml
      - run: uv run --no-sync pytest tests/unit/metrics tests/consistency/test_metrics.py --cov=tradelearn.metrics --cov-report=term-missing --cov-fail-under=100
      - run: uv run --no-sync pytest tests/unit/core --doctest-modules tradelearn/core
      - run: uv run --no-sync pytest --doctest-modules tradelearn/data
      - run: uv run --no-sync pytest --doctest-modules tradelearn/metrics
      - run: uv run --no-sync interrogate tradelearn/core tradelearn/data tradelearn/factor tradelearn/indicators tradelearn/metrics tradelearn/report --fail-under 90

  consistency:
    name: consistency
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/prepare-oracle
      - run: python .github/actions/prepare-ci-environment.py --python 3.12
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync pytest tests/consistency/ -v --tb=short --junitxml=consistency-results.xml
      - name: Expose consistency failures
        if: failure()
        run: python scripts/report_test_failures.py consistency-results.xml
      - run: uv run --no-sync pytest tests/golden/ -v

  oracle:
    name: oracle-readiness
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/prepare-oracle
      - run: python .github/actions/prepare-ci-environment.py --python 3.12
      - run: uv pip install -e . --group dev --group ci --group oracle
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync python scripts/check_oracle.py

  official-na-boundary:
    name: official NA CP313 boundary
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: python .github/actions/prepare-ci-environment.py --python 3.13
      - run: uv pip install -e '.[nautilus]' --group dev --group ci
      - run: python scripts/check_ci_dependencies.py
      - run: uv run --no-sync pytest tests/test_observation_clock_domain.py tests/test_sdk_tl_version_boundary.py tests/test_live_order_mapping.py tests/test_live_native_group_replay.py --junitxml=na-results.xml
      - name: Expose official NA boundary failures
        if: failure()
        run: python scripts/report_test_failures.py na-results.xml

  native-linux-diagnostic:
    name: Archived Linux native failure diagnosis
    if: contains(github.event.head_commit.message, '[native-diagnostic]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest-auto64
          run-id: 43193414381
          github-token: ${{ github.token }}
          path: archived-wheels
      - uses: actions/download-artifact@v4
        with:
          name: native-qualification-ubuntu-latest
          run-id: 43193414381
          github-token: ${{ github.token }}
          path: archived-native
      - run: python -m pip install archived-wheels/*cp312*.whl 'KunQuant==0.1.12'
      - name: Inspect archived build and reproduce exact installed compiler profile
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess,sys
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          files=[(str(p.relative_to(root/'archived-native')),p.stat().st_size) for p in (root/'archived-native').rglob('*') if p.is_file()]
          from tradelearn.indicators._kunquant_compile import compiler_config
          print('::notice::'+json.dumps({'archived_files':files,'compiler':compiler_config().compiler,'clang':shutil.which('clang++'),'gcc':shutil.which('g++')}))
          cmd=[sys.executable,str(root/'tests/unit/indicators/kunquant_fixture.py'),'native-diagnostic','--github-actions']
          proc=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          pathlib.Path('native-diagnostic.log').write_text(proc.stdout)
          print(proc.stdout)
          if proc.returncode:
              message=proc.stdout[:8000]+'\n...\n'+proc.stdout[-12000:]
              print('::error::'+message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          sys.exit(proc.returncode)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-native-diagnostic-log
          path: ${{ runner.temp }}/native-diagnostic.log
