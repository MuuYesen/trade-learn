name: Public wheel qualification
on:
  # Select an actual built candidate/public version explicitly. Editing the
  # harness alone must not repeat unchanged historical031 qualification.
  workflow_dispatch:
    inputs:
      tl_version:
        type: string
        required: true
        default: '0.3.4'
      store_version:
        type: string
        required: true
        default: '0.2.1a8'
      source_sha:
        type: string
        required: true
      candidate_run:
        description: "Optional successful Release build-only run; never labels a candidate public"
        type: string
        required: false
permissions:
  contents: read
  actions: read
jobs:
  linux-public:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_run && inputs.source_sha || format('v{0}', inputs.tl_version) }}
          path: qualification-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify exact candidate run and download existing Linux wheels
        if: inputs.candidate_run
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PYCODE'
          import json, os, subprocess
          run = os.environ['CANDIDATE_RUN']
          assert run.isdecimal()
          data = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + run]))
          assert data['head_sha'] == os.environ['SOURCE_SHA']
          assert data['path'] == '.github/workflows/release.yml'
          assert data['conclusion'] == 'success'
          assert data['event'] in {'push', 'workflow_dispatch'} and data['head_branch'] == 'dev'
          # A test-only fix can use an explicit build-only dispatch because it
          # intentionally does not retrigger unchanged wheel inputs on push.
          jobs = json.loads(subprocess.check_output(['gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + run + '/jobs?per_page=100']))['jobs']
          publication = {job['name']: job['conclusion'] for job in jobs if job['name'] in {'Publish to PyPI', 'Publish GitHub Release'}}
          assert publication == {'Publish to PyPI': 'skipped', 'Publish GitHub Release': 'skipped'}, publication
          subprocess.run(['gh', 'run', 'download', run, '--repo', os.environ['GITHUB_REPOSITORY'], '--name', 'wheels-ubuntu-latest-auto64', '--dir', os.environ['RUNNER_TEMP'] + '/candidate-wheels'], check=True)
          PYCODE
      - name: Actual installed wheels; no build, no publish, no broker connection
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          TL_VERSION: ${{ inputs.tl_version }}
          STORE_VERSION: ${{ inputs.store_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PYCODE'
          import os, pathlib, subprocess, sys
          command = [sys.executable, '.github/actions/qualify-public-wheels.py', '--source', os.environ['GITHUB_WORKSPACE'] + '/qualification-source', '--work', os.environ['RUNNER_TEMP'] + '/public-wheel-qualification', '--tl', os.environ['TL_VERSION'], '--store', os.environ['STORE_VERSION'], '--sha', os.environ['SOURCE_SHA']]
          if os.environ.get('CANDIDATE_RUN'):
              wheels = list(pathlib.Path(os.environ['RUNNER_TEMP'], 'candidate-wheels').glob('*cp313-cp313*.whl'))
              assert len(wheels) == 1
              command += ['--candidate-wheel', str(wheels[0])]
          subprocess.run(command, check=True)
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-wheel-qualification
          path: |
            ${{ runner.temp }}/public-wheel-qualification/public-files.json
            ${{ runner.temp }}/public-wheel-qualification/source-inventory.json
            ${{ runner.temp }}/public-wheel-qualification/installed-receipt.json
            ${{ runner.temp }}/public-wheel-qualification/tests.xml
