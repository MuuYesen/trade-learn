name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish artifacts to PyPI after building"
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "dev"
    tags:
      - "v*"
    # CI/oracle preparation alone does not change wheel inputs. Keep the
    # existing in-flight platform build; tags/manual dispatch still rebuild.
    paths:
      - ".gitattributes"
      - ".cargo/**"
      - "Cargo*"
      - "pyproject.toml"
      - "rust/**"
      - "tradelearn/**"
      - "tradelearn_runtime/**"
      - "leafquant_monitor/**"
      - "THIRD_PARTY_LICENSES/**"
      - "README*.md"
      - "LICENSE"
      - "NOTICE"
      - "scripts/build_release.py"
      - "scripts/check_kunquant_artifact.py"
      - "scripts/check_order_lifecycle_wheel.py"
      - "scripts/check_preview_wheel.py"
      - "scripts/check_public_bridge_wheel.py"
      - "scripts/check_public_runtime_wheel.py"
      - "scripts/check_recorder_platform.py"
      - "scripts/check_release_closure.py"
      - "scripts/check_research_environment.py"
      - "scripts/examples/ml_strategy.py"
      - "scripts/finalize_wheel.py"
      - "scripts/generate_api_reference.py"
      - "scripts/native_recorder_smoke.py"
      - "examples/**"
      - "docs/guides/**"
      - "docs/api/**"
      - "docs/quickstart.md"
      - "docs/release/**"
      - "tests/test_filesystem_identity.py"
      - "tests/test_windows_delivery.py"
      - "tests/unit/indicators/kunquant_fixture.py"
      - "tests/unit/indicators/test_kunquant_native.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  release-metadata:
    name: Validate release version and exact-commit CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_release_metadata.py --publish "${{ github.event.inputs.publish || 'false' }}"

  sdist:
    name: Build source distribution
    needs: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install --upgrade build
      - name: Build sdist
        run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.cibw-archs }})
    needs: release-metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw-archs: auto64
            cibw-build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          - os: ubuntu-latest
            cibw-archs: aarch64
            cibw-build: "cp313-*"
          - os: macos-15
            cibw-archs: arm64
            cibw-build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
          - os: windows-latest
            cibw-archs: AMD64
            cibw-build: "cp310-* cp311-* cp312-* cp313-* cp314-*"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: docker/setup-qemu-action@v3
        if: matrix.os == 'ubuntu-latest' && matrix.cibw-archs == 'aarch64'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cibuildwheel
        run: python -m pip install --upgrade cibuildwheel
      - name: Verify Windows recorder platform semantics
        if: matrix.os == 'windows-latest'
        run: python scripts/check_recorder_platform.py
      - name: Build wheels
        env:
          CIBW_ARCHS: ${{ matrix.cibw-archs }}
          CIBW_BUILD: ${{ matrix.cibw-build }}
        run: python -m cibuildwheel --output-dir wheelhouse
      - name: Normalize SBOM source references without changing native bytes
        run: python scripts/finalize_wheel.py --directory wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.cibw-archs }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  native-indicators:
    name: Installed native indicators (${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-ubuntu-latest-auto64
          - os: macos-15
            artifact: wheels-macos-15-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installed-wheels
      - name: Install exact new wheel and fixed native backend
        shell: bash
        run: |
          python -m pip install installed-wheels/*cp312*.whl 'KunQuant==0.1.12' pytest
          python -m pip check
      - name: Build actual TS and STREAM libraries from the installed package
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -c 'import pathlib,tradelearn; assert not pathlib.Path(tradelearn.__file__).is_relative_to(pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"]))'
          python "$GITHUB_WORKSPACE/tests/unit/indicators/kunquant_fixture.py" "$RUNNER_TEMP/native-fixture" --github-actions
      - name: Real installed native numeric and lifecycle qualification; zero skips
        shell: bash
        env:
          TL2_KUNQUANT_FIXTURE: ${{ runner.temp }}/native-fixture/fixture.json
        run: |
          cd "$RUNNER_TEMP"
          printf '[pytest]\n' > qualification.ini
          python -m pytest --import-mode=importlib -c qualification.ini "$GITHUB_WORKSPACE/tests/unit/indicators/test_kunquant_native.py" --junitxml=native-results.xml -q
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('native-results.xml').getroot().iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) >= 23
          assert all(int(s.get(k, 0)) == 0 for s in suites for k in ('failures', 'errors', 'skipped'))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-qualification-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/native-fixture
            ${{ runner.temp }}/native-results.xml

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs:
      - release-metadata
      - sdist
      - wheels
      - native-indicators
    if: needs.release-metadata.outputs.publish == 'true'
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - sdist
      - wheels
      - publish
      - release-metadata
    if: needs.release-metadata.outputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ needs.release-metadata.outputs.prerelease == 'true' }}
