[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "trade-learn"
version = "0.2.9"
description = "Python quantitative research framework for traditional and ML strategies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "trade-learn contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "certifi>=2026.10.19",
    "urllib3>=2.8.0,<3",
    "idna>=3.15,<4",
    "numpy>=1.26",
    "pandas>=2.1",
    "tqdm",
    "typer",
    "pyyaml",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/MuuYesen/trade-learn"
Documentation = "https://muuyesen.github.io/trade-learn/"

[project.scripts]
tradelearn = "tradelearn.cli:main"

[project.optional-dependencies]
research = [
    "opentdx; python_version >= '3.12'",
    "websocket-client>=1.8",
    "pynesys-pynecore; python_version >= '3.11'",
    "TA-Lib",
    "scikit-learn",
    "causal-learn",
    "scipy",
    "pyarrow",
    "bokeh",
    "xlsxwriter",
    "jinja2",
    "numba>=0.65.1",
    "duckdb",
    "pandas-ta-classic",
    "Riskfolio-Lib",
    "optuna",
]
lab = [
    "jupyterlab",
    "jupyterlab-git",
    "ipywidgets",
    "jupyter-ai",
    "pygwalker",
    "mcp>=1.8.0,<2",
    "mlflow",
]
nautilus = [
    "nautilus_trader==2.0.0rc7; python_version >= '3.13' and python_version < '3.15'",
    "boto3==1.41.2",
    "botocore==1.41.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "interrogate",
    "cibuildwheel",
]
docs = [
    "mkdocs-material",
    "mkdocstrings-python",
]
ci = [
    "mcp>=1.8,<2",
    "openpyxl",
    "statsmodels",
    "tomli; python_version < '3.11'",
    "boto3==1.41.2",
    "botocore==1.41.6",
    "pandas-ta-classic",
    "opentdx; python_version >= '3.12'",
    "websocket-client>=1.8",
    "TA-Lib",
    "pynesys-pynecore; python_version >= '3.11'",
    "scipy",
    "pyarrow",
    "bokeh",
    "xlsxwriter",
    "jinja2",
    "scikit-learn",
    "causal-learn",
    "duckdb",
    "numba>=0.65.1",
]
oracle = [
    "backtesting>=0.6.5",
    "backtrader",
    "opentdx; python_version >= '3.12'",
]

[tool.maturin]
manifest-path = "rust/tradelearn-rust/Cargo.toml"
module-name = "tradelearn._rust"
python-source = "."
python-packages = ["tradelearn", "tradelearn_runtime", "leafquant_monitor"]
features = ["extension-module"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "NOTICE", format = "sdist" },
    { path = "THIRD_PARTY_LICENSES/**/*", format = ["sdist", "wheel"] },
    { path = "tradelearn_runtime/official_adapters.json", format = ["sdist", "wheel"] },
]

[tool.cibuildwheel]
test-requires = ["pytest"]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
test-command = "python {project}/scripts/check_preview_wheel.py"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = false
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
fail-under = 90
exclude = ["setup.py", "reference", "tests"]
